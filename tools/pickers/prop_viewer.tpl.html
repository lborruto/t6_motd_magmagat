<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const META = window.PROP_META;
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// the list
const groups = [...new Set(META.map((m) => m.group))];
const list = $('list');
const buttons = [];
for (const g of groups) {
  const sec = document.createElement('section');
  sec.className = 'group';
  sec.innerHTML = `<h2>${g}</h2><ul></ul>`;
  const ul = sec.querySelector('ul');
  META.forEach((m, i) => {
    if (m.group !== g) return;
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'item';
    b.innerHTML = `<span class="label"></span><span class="code"></span>${m.ours ? '<span class="tag"></span>' : ''}`;
    b.querySelector('.label').textContent = m.label;
    b.querySelector('.code').textContent = m.name;
    if (m.ours) b.querySelector('.tag').textContent = `in mod: ${m.ours}`;
    b.addEventListener('click', () => show(i));
    buttons[i] = b;
    li.appendChild(b);
    ul.appendChild(li);
  });
  list.appendChild(sec);
}

// the stage
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3228, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(60, 120, 80);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9fc7ff, 0.7);
fill.position.set(-80, 40, -60);
scene.add(fill);

let grid = null;
const player = new THREE.Group();
function themeColours() {
  scene.background = new THREE.Color(css('--viewport'));
  if (grid) scene.remove(grid);
  grid = new THREE.GridHelper(240, 20, new THREE.Color(css('--grid')), new THREE.Color(css('--grid')));
  grid.visible = $('t-grid').checked;
  scene.add(grid);
  player.traverse((o) => { if (o.material) o.material.color.set(css('--player')); });
}
{
  const mat = new THREE.MeshStandardMaterial({ color: 0x5cc4ff, transparent: true, opacity: 0.28, roughness: 1 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(8, 72 - 16 - 18, 6, 16), mat);
  body.position.y = 8 + (72 - 16 - 18) / 2;
  const head = new THREE.Mesh(new THREE.SphereGeometry(6, 20, 14), mat);
  head.position.y = 72 - 6;
  player.add(body, head);
  scene.add(player);
}
themeColours();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeColours);
new MutationObserver(themeColours).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

// models: Greyhound glTF is Z-up in centimetres; T6 is inches, shown Y-up here
// The page's frame blocks fetch(), and GLTFLoader fetches even data: URIs, so the glTF is read here instead:
// the buffer is decoded with atob and textures load through <img> (data: images are allowed).
const COMPS = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4 };
const ARRAYS = { 5120: Int8Array, 5121: Uint8Array, 5122: Int16Array, 5123: Uint16Array, 5125: Uint32Array, 5126: Float32Array };
function decodeBuffer(uri) {
  const bin = atob(uri.slice(uri.indexOf(',') + 1));
  const out = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) out[k] = bin.charCodeAt(k);
  return out.buffer;
}
function readAccessor(g, bufs, ai) {
  const a = g.accessors[ai];
  const bv = g.bufferViews[a.bufferView];
  const Arr = ARRAYS[a.componentType];
  const n = COMPS[a.type];
  const base = (bv.byteOffset || 0) + (a.byteOffset || 0);
  const tight = n * Arr.BYTES_PER_ELEMENT;
  const stride = bv.byteStride || tight;
  const buf = bufs[bv.buffer];
  if (stride === tight && base % Arr.BYTES_PER_ELEMENT === 0) return { array: new Arr(buf, base, a.count * n), n };
  const out = new Arr(a.count * n);
  const view = new DataView(buf);
  const get = { 5120: 'getInt8', 5121: 'getUint8', 5122: 'getInt16', 5123: 'getUint16', 5125: 'getUint32', 5126: 'getFloat32' }[a.componentType];
  for (let v = 0; v < a.count; v++)
    for (let c = 0; c < n; c++) out[v * n + c] = view[get](base + v * stride + c * Arr.BYTES_PER_ELEMENT, true);
  return { array: out, n };
}
function buildGltf(g) {
  const bufs = g.buffers.map((b) => decodeBuffer(b.uri));
  const texCache = new Map();
  const texture = (ti, srgb) => {
    const key = ti + (srgb ? 's' : 'l');
    if (texCache.has(key)) return texCache.get(key);
    const img = g.images[g.textures[ti].source];
    const t = new THREE.Texture();
    const el = new Image();
    el.onload = () => { t.image = el; t.needsUpdate = true; };
    el.src = img.uri;
    t.flipY = false;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.anisotropy = 4;
    texCache.set(key, t);
    return t;
  };
  const mats = (g.materials || []).map((m) => {
    const p = m.pbrMetallicRoughness || {};
    const mat = new THREE.MeshStandardMaterial({ roughness: 0.8, metalness: 0, side: THREE.DoubleSide });
    if (p.baseColorTexture) mat.map = texture(p.baseColorTexture.index, true);
    if (m.normalTexture) mat.normalMap = texture(m.normalTexture.index, false);
    if (m.alphaMode === 'MASK' || (mat.map && /^data:image\/png/.test(g.images[g.textures[p.baseColorTexture.index].source].uri))) mat.alphaTest = 0.5;
    if (m.alphaMode === 'BLEND') mat.transparent = true;
    return mat;
  });
  const fallback = new THREE.MeshStandardMaterial({ color: 0x9aa4a8, roughness: 0.8, side: THREE.DoubleSide });
  const root = new THREE.Group();
  g.nodes.forEach((node) => {
    if (node.mesh === undefined) return;
    const holder = new THREE.Group();
    if (node.matrix) holder.applyMatrix4(new THREE.Matrix4().fromArray(node.matrix));
    if (node.translation) holder.position.fromArray(node.translation);
    if (node.rotation) holder.quaternion.fromArray(node.rotation);
    if (node.scale) holder.scale.fromArray(node.scale);
    for (const prim of g.meshes[node.mesh].primitives) {
      const geo = new THREE.BufferGeometry();
      const at = prim.attributes;
      const put = (name, key) => {
        if (at[key] === undefined) return;
        const r = readAccessor(g, bufs, at[key]);
        geo.setAttribute(name, new THREE.BufferAttribute(r.array, r.n));
      };
      put('position', 'POSITION');
      put('normal', 'NORMAL');
      put('uv', 'TEXCOORD_0');
      if (prim.indices !== undefined) geo.setIndex(new THREE.BufferAttribute(readAccessor(g, bufs, prim.indices).array, 1));
      if (at.NORMAL === undefined) geo.computeVertexNormals();
      holder.add(new THREE.Mesh(geo, mats[prim.material] || fallback));
    }
    root.add(holder);
  });
  return root;
}
const cache = new Map();
let current = null;
let token = 0;
function parse(i) {
  if (cache.has(i)) return Promise.resolve(cache.get(i));
  const json = $('gltf-' + i).textContent;
  return new Promise((ok) => {
    const root = new THREE.Group();
    const inner = buildGltf(JSON.parse(json));
    inner.rotation.x = -Math.PI / 2;
    inner.scale.setScalar(1 / 2.54);
    root.add(inner);
    root.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(root);
    const c = box.getCenter(new THREE.Vector3());
    inner.position.set(-c.x, -box.min.y, -c.z);
    root.updateMatrixWorld(true);
    const size = box.getSize(new THREE.Vector3());
    const out = { root, size };
    cache.set(i, out);
    ok(out);
  });
}
const fmt = (v) => `${v.toFixed(1)} in`;
async function show(i) {
  const my = ++token;
  const m = META[i];
  buttons.forEach((b, k) => b.setAttribute('aria-current', k === i ? 'true' : 'false'));
  $('m-label').textContent = m.label;
  $('m-name').textContent = m.name;
  $('s-v').textContent = m.verts.toLocaleString('en-US');
  $('s-o').textContent = m.ours || 'not yet';
  $('m-note').textContent = m.missing.length
    ? `Not in the Greyhound texture export, shown plain: ${m.missing.join(', ')}`
    : '';
  $('loading').textContent = 'Loading model…';
  $('loading').hidden = false;
  let res;
  try { res = await parse(i); } catch (e) { $('loading').textContent = 'This model did not load: ' + String(e.message).slice(0, 200); return; }
  if (my !== token) return;
  $('loading').hidden = true;
  if (current) scene.remove(current);
  current = res.root;
  applyWire();
  scene.add(current);
  $('s-w').textContent = fmt(res.size.x);
  $('s-d').textContent = fmt(res.size.z);
  $('s-h').textContent = fmt(res.size.y);
  player.position.set(res.size.x / 2 + 24, 0, 0);
  const span = Math.max(res.size.x + 48, res.size.y, 72);
  const dist = span / (2 * Math.tan((camera.fov * Math.PI) / 360)) * 1.25;
  controls.target.set(12, Math.max(res.size.y, 36) / 2, 0);
  camera.position.set(dist * 0.55, Math.max(res.size.y, 36) * 0.75, dist * 0.85);
  controls.update();
  try { localStorage.setItem('mg-prop-viewer', String(i)); } catch (e) {}
}
function applyWire() {
  if (!current) return;
  const w = $('t-wire').checked;
  current.traverse((o) => { if (o.isMesh) o.material.wireframe = w; });
}
$('t-player').addEventListener('change', (e) => { player.visible = e.target.checked; });
$('t-grid').addEventListener('change', (e) => { if (grid) grid.visible = e.target.checked; });
$('t-wire').addEventListener('change', applyWire);

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame() {
  if ($('t-spin').checked && current && !reduce) current.rotation.y += 0.006;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resize();
let start = 0;
try { start = Math.min(META.length - 1, Math.max(0, parseInt(localStorage.getItem('mg-prop-viewer') || '0', 10) || 0)); } catch (e) {}
show(start);
frame();
</script>
