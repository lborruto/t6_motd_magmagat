name: Check the scripts

# Every push and pull request: the lints, then a pack test (one file, else two, else three) to prove the quest
# scripts still load. Nothing is published: the release carries the mod.ff, which is built from the games' own
# files (tools/release.pl, run locally), and its zip is attached to a GitHub Release by hand.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Lint the sources
        # lint_includes: a source calling a vanilla helper without the utility includes fails at load
        # lint_sounds: a sound alias that no zm_prison bank carries is silent in game
        # lint_calls: a call to a helper that does not exist in T6 fails at load (skips where the vanilla dump is absent)
        run: perl tools/lint_includes.pl && perl tools/lint_sounds.pl && perl tools/lint_calls.pl

      - name: Check the cross-file calls
        run: perl tools/check_links.pl .

      - name: Pack the sources
        # pack.pl refuses a file whose string block would pass the engine limit (exit 3)
        run: |
          perl tools/pack.pl --out release/zm_prison_magmagat.gsc --parts 1 \
            || perl tools/pack.pl --out release/zm_prison_magmagat.gsc --parts 2 \
            || perl tools/pack.pl --out release/zm_prison_magmagat.gsc --parts 3
          ls -la release/
